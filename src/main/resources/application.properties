spring.application.name=tema5

# La URL, el usuario MySQL y la contraseña se configuran en cada equipo.
# DB_URL incluye sslMode=REQUIRED; el CA se configurará cuando esté disponible.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# El esquema se crea con database/schema.sql, no desde Hibernate.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
